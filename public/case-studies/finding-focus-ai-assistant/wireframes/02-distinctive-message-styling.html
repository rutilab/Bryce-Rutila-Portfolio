<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wireframe — Distinctive user vs AI styling</title>
<script>if (/\bembed=1\b/.test(location.search)) document.documentElement.classList.add("embed");</script>
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: #e9e9e9;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}

.page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

/* Case-study embed: center the intrinsic chat frame and scale it to fit */
html.embed, html.embed body {
  background: transparent;
  overflow: hidden;
  height: 100%;
  width: 100%;
}
html.embed .page {
  min-height: 0;
  width: 100%;
  height: 100%;
  padding: 20px 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
html.embed .frame {
  width: 480px;
  height: 620px;
  max-width: none;
  flex-shrink: 0;
  pointer-events: none;
  user-select: none;
  transform-origin: center center;
}



/* ── Lo-fi chat frame: plain grayscale, no branding ─────────────────── */
.frame {
  width: 480px;
  max-width: 100%;
  height: 620px;
  background: #fff;
  border: 1.5px solid #bbb;
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.frame-header {
  height: 44px;
  flex-shrink: 0;
  border-bottom: 1.5px solid #bbb;
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 8px;
}
.frame-header .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  border: 1.5px solid #999;
}
.frame-header .bar {
  height: 8px;
  width: 100px;
  background: #ddd;
  border-radius: 4px;
}

.frame-body {
  flex-grow: 1;
  overflow-y: auto;
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.msg { display: flex; gap: 10px; align-items: flex-start; }
.msg.user { justify-content: flex-end; }
.msg.ai { justify-content: flex-start; }

.avatar {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 1.5px solid #999;
  background: #f2f2f2;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.avatar svg {
  width: 14px;
  height: 14px;
}

.bubble {
  max-width: 76%;
  padding: 10px 14px;
  border-radius: 14px;
  font-size: 14px;
  line-height: 1.5;
  color: #222;
}
.msg.user .bubble {
  background: #ececec;
  border: 1.5px solid #ccc;
  border-bottom-right-radius: 4px;
}
.msg.ai .bubble {
  background: none;
  border: none;
  padding: 0;
}

.frame-footer {
  flex-shrink: 0;
  border-top: 1.5px solid #bbb;
  padding: 12px 14px;
  display: flex;
  align-items: center;
}
.footer-input {
  flex-grow: 1;
  height: 34px;
  border: 1.5px solid #ccc;
  border-radius: 999px;
  background: #f5f5f5;
}

</style>
</head>
<body>
<div class="page">
  <div>

    <div class="frame">
      <div class="frame-header">
        <div class="dot"></div>
        <div class="bar"></div>
      </div>

      <div class="frame-body">
        <div class="msg user">
          <div class="bubble">How do you make user messages distinctive from the AI responses?</div>
        </div>
        <div class="msg ai">
          <div class="avatar">
            <svg viewBox="0 0 24 24" fill="#999">
              <path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2z"/>
            </svg>
          </div>
          <div class="bubble">User messages are right-aligned in text bubbles, while the AI responses are left aligned with no text bubble. AI responses should also include a small icon next to the text, so it's immediately clear whose message is whose.</div>
        </div>
      </div>

      <div class="frame-footer">
        <div class="footer-input"></div>
      </div>
    </div>

  </div>
</div>

<script>
(function () {
  if (!document.documentElement.classList.contains('embed')) return;
  var page = document.querySelector('.page');
  var frame = document.querySelector('.frame');
  if (!page || !frame) return;

  var wrap = document.createElement('div');
  wrap.className = 'embed-fit';
  wrap.style.overflow = 'hidden';
  wrap.style.flexShrink = '0';
  frame.parentNode.insertBefore(wrap, frame);
  wrap.appendChild(frame);
  frame.style.transformOrigin = 'top left';

  function fit() {
    // Keep ~20px padding top/bottom (and sides) while scaling the 480×620 frame up to fill
    var padX = 24, padY = 40;
    var sw = (page.clientWidth - padX) / 480;
    var sh = (page.clientHeight - padY) / 620;
    var s = Math.max(0.25, Math.min(sw, sh));
    wrap.style.width = (480 * s) + 'px';
    wrap.style.height = (620 * s) + 'px';
    frame.style.transform = 'scale(' + s + ')';
  }
  fit();
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(fit).observe(page);
  } else {
    window.addEventListener('resize', fit);
  }
})();
</script>

</body>
</html>
